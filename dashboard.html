<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ড্যাশবোর্ড - GrowWealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="text-2xl font-bold text-blue-600">GrowWealth</span>
            <button onclick="logout()" class="text-red-600 bg-red-50 px-4 py-2 rounded-lg text-sm font-semibold">লগআউট</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-sm">মোট ইনভেস্টমেন্ট</p>
                <p class="text-3xl font-bold mt-2">৳ <span id="total-invest">0</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-sm">মোট অর্জিত লাভ</p>
                <p class="text-3xl font-bold text-green-600 mt-2">৳ <span id="total-profit">0</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100">
                <p class="text-gray-400 text-sm">বর্তমান মোট ব্যালেন্স</p>
                <p class="text-3xl font-bold text-blue-600 mt-2">৳ <span id="current-balance">0</span></p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4">নতুন ইনভেস্ট করুন</h2>
            <input type="number" id="invest-amount" placeholder="পরিমাণ" class="w-full px-4 py-2 border rounded-xl mb-3">
            <button onclick="handleInvest()" class="w-full bg-blue-600 text-white py-2 rounded-xl">ইনভেস্ট সাবমিট</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        const firebaseConfig = { /* আপনার সেই কনফিগ এখানে বসান */ };
        initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    const data = doc.data();
                    document.getElementById('total-invest').innerText = data.totalInvest;
                    document.getElementById('total-profit').innerText = data.totalProfit;
                    document.getElementById('current-balance').innerText = data.totalInvest + data.totalProfit;
                });
            } else { window.location.href = "index.html"; }
        });

        window.handleInvest = async () => {
            const amount = document.getElementById('invest-amount').value;
            await addDoc(collection(db, "payments"), { uid: auth.currentUser.uid, amount: parseInt(amount), status: "pending" });
            alert("রিকোয়েস্ট জমা হয়েছে!");
        };
        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
