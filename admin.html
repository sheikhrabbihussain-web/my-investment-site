<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>অ্যাডমিন প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold mb-4">ব্যালেন্স আপডেট করুন</h2>
        <input type="text" id="uid" placeholder="ইউজার UID" class="w-full p-2 border rounded mb-2">
        <input type="number" id="newBalance" placeholder="নতুন ব্যালেন্স" class="w-full p-2 border rounded mb-2">
        <button onclick="updateBalance()" class="w-full bg-green-600 text-white p-2 rounded">আপডেট করুন</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABdPpBa_KODkbZ9u8kWjWpTwUPRe9QRVA",
            authDomain: "dippo-2ad10.firebaseapp.com",
            projectId: "dippo-2ad10",
            storageBucket: "dippo-2ad10.firebasestorage.app",
            messagingSenderId: "515903837375",
            appId: "1:515903837375:web:73b82fcfa4a62db837620a"
        };
        initializeApp(firebaseConfig);
        const db = getFirestore();

        window.updateBalance = async () => {
            const uid = document.getElementById('uid').value;
            const balance = parseInt(document.getElementById('newBalance').value);
            await updateDoc(doc(db, "users", uid), { balance: balance });
            alert("ব্যালেন্স আপডেট হয়েছে!");
        };
    </script>
</body>
</html>
