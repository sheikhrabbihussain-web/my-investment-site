<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ড্যাশবোর্ড - GrowWealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <h2 class="text-gray-600">স্বাগতম, <span id="userName" class="font-bold text-black"></span></h2>
        
        <div class="my-6 p-6 bg-blue-50 rounded-xl border border-blue-200 text-center">
            <p class="text-sm text-blue-600">আপনার বর্তমান ব্যালেন্স</p>
            <h1 class="text-4xl font-extrabold text-blue-700">৳ <span id="balance">0</span></h1>
        </div>

        <div class="border-t pt-6">
            <h3 class="font-bold mb-3 text-gray-700">পেমেন্ট রিকোয়েস্ট পাঠান</h3>
            <input type="text" id="trxId" placeholder="বিকাশ/নগদ TrxID" class="w-full p-3 border rounded-lg mb-2">
            <input type="number" id="amount" placeholder="টাকার পরিমাণ" class="w-full p-3 border rounded-lg mb-3">
            <button onclick="sendPaymentRequest()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold">রিকোয়েস্ট জমা দিন</button>
        </div>

        <button onclick="logout()" class="mt-6 w-full bg-red-500 text-white p-3 rounded-lg font-bold">লগআউট</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABdPpBa_KODkbZ9u8kWjWpTwUPRe9QRVA",
            authDomain: "dippo-2ad10.firebaseapp.com",
            projectId: "dippo-2ad10",
            storageBucket: "dippo-2ad10.firebasestorage.app",
            messagingSenderId: "515903837375",
            appId: "1:515903837375:web:73b82fcfa4a62db837620a",
            measurementId: "G-ENELXH0QK7"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        // ইউজার ডেটা লোড করা
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    document.getElementById('balance').innerText = snap.data().balance;
                    document.getElementById('userName').innerText = snap.data().name;
                }
            } else { window.location.href = "index.html"; }
        });

        // পেমেন্ট রিকোয়েস্ট পাঠানো
        window.sendPaymentRequest = async () => {
            const trx = document.getElementById('trxId').value;
            const amount = document.getElementById('amount').value;
            if(!trx || !amount) return alert("সব ঘর পূরণ করুন!");

            try {
                await addDoc(collection(db, "payments"), {
                    uid: auth.currentUser.uid,
                    userName: document.getElementById('userName').innerText,
                    trxId: trx,
                    amount: amount,
                    status: "pending",
                    date: new Date().toLocaleDateString()
                });
                alert("পেমেন্ট রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!");
            } catch (e) { alert("Error: " + e.message); }
        };

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
